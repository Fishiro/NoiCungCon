services:
    services:
        # ---------- Backend Flask ----------
        - type: web
          name: noicungcon-backend
          runtime: python
          rootDir: backend
          plan: free
          buildCommand: pip install -r requirements.txt
          startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 90
          healthCheckPath: /health
          envVars:
              - key: PYTHON_VERSION
                value: 3.12.7
              - key: OPENROUTER_API_KEY
                sync: false
              - key: AI_MODEL
                value: openai/gpt-4o
              - key: FRONTEND_ORIGIN
                sync: false

        # ---------- Frontend React (Static Site) ----------
        - type: web
          name: noicungcon
          runtime: static
          rootDir: frontend
          buildCommand: npm install && npm run build
          staticPublishPath: dist
          envVars:
              - key: NODE_VERSION
                value: 22.12.0
              - key: VITE_API_BASE_URL
                sync: false
